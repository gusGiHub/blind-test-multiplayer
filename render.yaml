services:
  - type: web
    name: blind-test-multiplayer
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
